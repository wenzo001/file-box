<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>文件盒子</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%23007AFF'/><path d='M12 16V7M7.5 11.5L12 7l4.5 4.5' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="progress-strip.css">
<style>
  /* ---------- iOS 系统颜色（Apple HIG） ---------- */
  :root {
    --bg: #F2F2F7;                      /* systemGroupedBackground */
    --card: #FFFFFF;                    /* secondarySystemGroupedBackground */
    --hdr: rgba(242,242,247,.82);
    --text: #1C1C1E;                    /* label */
    --text2: #565B62;                   /* secondaryLabel：在白卡上 6.84:1。原来是 rgba(60,60,67,.6)→#8a8a8a，只有 3.45:1，13px 的次要文字不达 AA */
    --text3: rgba(60,60,67,.32);        /* tertiaryLabel */
    --accent: #0059B3;                  /* systemBlue 的 AA 版本：蓝字在白卡 6.82:1、在半透明头部 6.1:1（#007AFF 只有 4.02:1，#0071E3 在头部 4.21:1） */
    --accent-fill: #0071E3;             /* 实底按钮用：白字对比度 4.70:1（#007AFF 仅 4.02:1，不足 AA 4.5:1） */
    --accent-ink: var(--accent);        /* 行内文字按钮的蓝：与 --accent 同一支，免得两套蓝各走各路 */
    --label-ink: #4A4F55;               /* 标签类次要文字：在 --fill 底上 7.5:1（原 --text2 只有 2.5:1） */
    --red: #FF3B30;                     /* systemRed */
    --sep: rgba(60,60,67,.29);          /* separator */
    --fill: rgba(120,120,128,.12);      /* systemFill */
    --ok: #34C759;                      /* systemGreen */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1C1C1E;
      --hdr: rgba(0,0,0,.72);
      --text: #FFFFFF;
      --text2: rgba(235,235,245,.6);
      --text3: rgba(235,235,245,.32);
      --accent: #0A84FF;
      --accent-fill: #0A69E8;           /* 暗色实底：白字 5.00:1 */
      --accent-ink: #0A84FF;            /* 暗色下的蓝色文字：在 --card 上 4.66:1（--accent-fill 只有 3.62:1） */
      --label-ink: #C7C9CF;             /* 暗色下的次要文字标签 */
      --red: #FF453A;
      --sep: rgba(84,84,88,.6);
      --fill: rgba(120,120,128,.24);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro SC",
      "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.4;
    min-height: 100svh;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    transition: background-color .3s;
  }

  /* ---------- 顶部大标题（毛玻璃） ---------- */
  header {
    position: sticky; top: 0; z-index: 60;
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: calc(14px + env(safe-area-inset-top)) 20px 8px;
    background: var(--hdr);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
  }
  header h1 {
    font-size: 34px; font-weight: 700; letter-spacing: -0.4px;
  }
  header button.refresh {
    border: none; background: transparent; color: var(--accent);
    font-size: 17px; font-weight: 500; cursor: pointer;
    padding: 8px 2px; border-radius: 8px; -webkit-user-select: none; user-select: none;
  }
  header button.refresh:active { opacity: .4; }
  .hdr-acts { display: flex; align-items: baseline; gap: 16px; }
  header a.xfer {
    color: var(--accent); font-size: 17px; font-weight: 500; text-decoration: none;
    padding: 8px 2px; border-radius: 8px; -webkit-user-select: none; user-select: none;
  }
  header a.xfer:active { opacity: .4; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 6px 16px 40px;
    padding-bottom: calc(40px + env(safe-area-inset-bottom)); }

  /* ---------- 分段标题（iOS 样式） ---------- */
  .sec {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--text2);
    text-transform: uppercase; letter-spacing: .4px;
    margin: 24px 20px 7px;
  }
  .sec .sec-note { font-size: 12px; font-weight: 400; color: var(--text3); text-transform: none; letter-spacing: 0; }

  /* ---------- 分组面板 ---------- */
  .panel {
    background: var(--card); border-radius: 12px; overflow: hidden;
  }

  /* ---------- 上传 ---------- */
  .upload-pad { padding: 16px; border-radius: 12px; transition: background .2s; }
  .panel.dragging { box-shadow: inset 0 0 0 2px var(--accent); }
  .panel.dragging .upload-pad { background: var(--fill); }

  .step-hint {
    font-size: 13px; color: var(--text2); text-align: center;
    margin-top: 10px; line-height: 1.6;
  }
  .step-hint .accent { color: var(--accent); font-weight: 500; }
  .step-hint i { font-style: normal; }

  /* 已选清单 */
  .staged-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 16px;
  }
  .staged-head .t { font-size: 15px; font-weight: 600; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .staged-head .ops { flex-shrink: 0; }

  #file-list { max-height: 216px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #file-list .row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 0; border-bottom: 0.5px solid var(--sep);
    font-size: 15px; color: var(--text);
  }
  #file-list .row:last-child { border-bottom: none; }
  #file-list .row span { flex: 1; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #file-list .row b { font-weight: 400; color: var(--text2); flex-shrink: 0; font-size: 13px; }
  /* 视觉小、可点区域 44×44（Apple HIG 最小触摸目标）。
     右边距必须是 0：#file-list 有 overflow-y:auto，CSS 会把 overflow-x 一并算成 auto，
     任何伸出容器右边缘的东西（比如之前那个 -10px）都会冒出一条横向滚动条 */
  #file-list .rm {
    flex-shrink: 0; width: 44px; height: 44px; margin: -11px 0 -11px -6px;
    border: none; background: transparent; color: var(--text3);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  #file-list .rm svg { width: 15px; height: 15px; }
  #file-list .rm:active { opacity: .4; }

  /* 上传进度：进度条本体样式在 progress-strip.css（与无痕传输页共用）；
     这里只留状态行。每块 = 一个上传块（约 4MiB），格子大小由 layoutStrip 算 */
  #up-status {
    font-size: 13px; color: var(--text2); margin-top: 8px; text-align: center;
    font-variant-numeric: tabular-nums;
    white-space: pre-line; /* 换行点由代码里的 \n 决定：中文可以任意断行，交给浏览器会变成"一 / 格 ≈ 4 MB" */
  }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; border: none; cursor: pointer;
    font: inherit; font-size: 17px; font-weight: 600;
    height: 50px; border-radius: 12px; margin-top: 14px;
    -webkit-user-select: none; user-select: none;
    transition: opacity .15s; touch-action: manipulation;
  }
  .btn svg { width: 19px; height: 19px; flex-shrink: 0; }
  .btn:disabled { opacity: .4; }
  .btn-primary { background: var(--accent-fill); color: #fff; }
  .btn-primary:active:not(:disabled) { opacity: .6; }
  #pick { margin-top: 0; }

  /* ---------- 文件列表 ---------- */
  #loading { text-align: center; padding: 30px 0 26px; color: var(--text2);
    font-size: 13px; }
  .spinner { width: 20px; height: 20px; margin: 0 auto 8px; border-radius: 50%;
    border: 2.5px solid var(--fill); border-top-color: var(--accent);
    animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #empty { text-align: center; padding: 30px 0 26px; color: var(--text2); font-size: 15px; }

  .folder { }
  .folder-head {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 16px; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  .folder-head:active { background: var(--fill); }
  .folder:not(:last-child) .folder-head { border-bottom: 0.5px solid var(--sep); }
  .folder-head .chev {
    flex-shrink: 0; width: 8px; height: 13px; color: var(--text3);
    display: flex; align-items: center; justify-content: center;
    margin-top: 6px;
  }
  .folder-head .chev svg { width: 8px; height: 13px; }
  .folder.open .chev { transform: rotate(90deg); }
  .folder-head .chev { transition: transform .28s cubic-bezier(.32,.72,0,1); }
  .folder-main { flex: 1; min-width: 0; padding-top: 2px; }
  .folder-time { font-size: 17px; font-weight: 500; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  /* 副标题宁可换行也不许裁掉：加了"下载 N 次"之后，320px 上被 ellipsis 吃掉的是末尾那张
     "周三 · 2 周前"标签——那是静默丢信息，比多出一行高度糟糕得多 */
  .folder-meta { font-size: 13px; color: var(--text2); margin-top: 1px; line-height: 1.35; }
  .tag { display: inline-block; font-size: 12px; font-weight: 500; color: var(--label-ink);
    background: var(--fill); border-radius: 5px; padding: 1px 7px; margin-left: 4px;
    vertical-align: 1px; -webkit-user-select: none; user-select: none; }
  /* 热乎：蓝色实底（白字 4.70:1，达 WCAG AA） */
  .tag.hot { background: var(--accent-fill); color: #fff; font-weight: 600; }
  .acts { display: flex; gap: 2px; flex-shrink: 0; }
  .linkbtn {
    flex-shrink: 0; border: none; background: transparent; color: var(--accent-ink);
    font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
    padding: 8px 6px; border-radius: 8px; -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  .linkbtn:active { opacity: .4; }
  .del {
    flex-shrink: 0; border: none; background: transparent; color: var(--red);
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 8px; -webkit-user-select: none; user-select: none;
    touch-action: manipulation; margin-left: 2px;
  }
  .del svg { width: 20px; height: 20px; }
  .del:active { opacity: .4; }

  /* ---------- 触摸设备：所有可点控件至少 44×44（Apple HIG 最小触摸目标） ----------
     只放大命中区域，不改字号与外观；桌面（精确指针）不受影响。 */
  @media (pointer: coarse) {
    .linkbtn, .file-row a, .copy-btn, header button.refresh, header a.xfer {
      min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center;
    }
    .del { width: 44px; height: 44px; }
  }

  .folder-body { display: none; }

  .file-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px 12px 34px; font-size: 15px;
    border-top: 0.5px solid var(--sep);
  }
  .file-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .file-row .size { color: var(--text2); font-size: 13px; flex-shrink: 0; }
  /* 下载次数与大小同一视觉层级（都是次要信息），数字用等宽避免"下载 9 次→10 次"时抖动 */
  .file-row .dl-count { color: var(--text2); font-size: 13px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .file-row a {
    color: var(--accent); text-decoration: none; font-size: 15px; font-weight: 500;
    flex-shrink: 0; padding: 6px 4px; border-radius: 8px;
    -webkit-user-select: none; user-select: none;
  }
  .file-row a:active { opacity: .4; }

  .folder.open .folder-body { display: block; }

  .folder.highlight .folder-head { background: var(--fill); }

  /* ---------- 存储用量 ---------- */
  .usage { margin-top: 12px; }
  .usage-bar { height: 5px; border-radius: 3px; background: var(--fill); overflow: hidden; }
  .usage-bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .3s; }
  .usage-text { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--text2); }
  .usage.warn .usage-bar > div { background: var(--red); }
  .usage.warn .usage-text { color: var(--red); font-weight: 500; }
  .warn {
    margin-top: 10px; border-radius: 10px; padding: 10px 12px;
    background: rgba(255,59,48,.12); color: var(--red); font-size: 13px; line-height: 1.5;
  }

  /* ---------- 地址分享 ---------- */
  .share-pad { padding: 16px; }
  .share-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg); border-radius: 10px; padding: 5px 6px 5px 14px;
  }
  .share-row .url { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-size: 15px; color: var(--text); user-select: text;
    -webkit-user-select: text; -webkit-touch-callout: default; }
  .copy-btn {
    flex-shrink: 0; border: none; background: var(--accent-fill); color: #fff;
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    padding: 9px 18px; border-radius: 9px;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  .copy-btn:active { opacity: .6; }
  .share-hint { font-size: 12px; color: var(--text2); margin-top: 10px; line-height: 1.5; }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top));
    transform: translateX(-50%) translateY(-80px);
    background: rgba(28,28,30,.88); color: #fff; padding: 10px 18px; border-radius: 13px;
    font-size: 14px; max-width: 86vw; text-align: center; z-index: 200;
    box-shadow: 0 12px 32px rgba(0,0,0,.28);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    opacity: 0; transition: transform .32s cubic-bezier(.32,.72,0,1), opacity .25s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- 删除确认（iOS 弹层） ---------- */
  .sheet-overlay {
    position: fixed; inset: 0; z-index: 300; display: flex; align-items: flex-end;
    justify-content: center; background: rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .28s;
  }
  .sheet-overlay.show { opacity: 1; pointer-events: auto; }
  .sheet {
    width: 100%; max-width: 440px; background: var(--card);
    border-radius: 16px; padding: 20px 16px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(40px); opacity: 0;
    transition: transform .34s cubic-bezier(.32,.72,0,1), opacity .24s;
  }
  .sheet-overlay.show .sheet { transform: translateY(0); opacity: 1; }
  .sheet-title { font-size: 17px; font-weight: 600; text-align: center; }
  .sheet-msg { font-size: 13px; color: var(--text2); text-align: center; margin-top: 6px; line-height: 1.5; }
  .sheet-group { border-radius: 12px; overflow: hidden; margin-top: 16px; background: var(--bg); }
  .sheet-group button {
    display: block; width: 100%; height: 48px; border: none; background: transparent;
    font: inherit; font-size: 17px; cursor: pointer;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  .sheet-group button + button { border-top: 0.5px solid var(--sep); }
  .sheet-group button:active { background: var(--fill); }
  .sheet-del { color: var(--red); font-weight: 600; }
  .sheet-cancel { color: var(--accent); font-weight: 500; }
  @media (min-width: 480px) {
    .sheet-overlay { align-items: center; }
  }

  @media (max-width: 480px) {
    header { padding-left: 16px; padding-right: 16px; }
    header h1 { font-size: 30px; }
    .wrap { padding-left: 12px; padding-right: 12px; }
    /* 目录行：操作按钮换到第二行，避免挤掉时间 */
    .folder-head { flex-wrap: wrap; row-gap: 2px; }
    .folder-head .del { order: 1; }
    .folder-head .acts { order: 2; flex-basis: 100%; padding-left: 18px; }
  }
</style>
</head>
<body>
<header>
  <h1>文件盒子</h1>
  <div class="hdr-acts">
    <a class="xfer" href="transfer.html">无痕传输</a>
    <button class="refresh" onclick="loadList()">刷新</button>
  </div>
</header>

<div class="wrap">
  <div class="sec">上传文件</div>
  <section class="panel" id="drop">
    <div class="upload-pad">
      <form id="form">
        <input type="file" id="input" multiple hidden>

        <!-- 第 1 步：主按钮 = 选择文件 -->
        <button type="button" class="btn btn-primary" id="pick">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 20h16"/>
          </svg>
          选择文件
        </button>
        <div class="step-hint" id="pick-hint">可一次选<span class="accent">多个文件</span>，选好后点「上传」才会发送<i id="hint-drag">，也可直接把文件拖进来</i></div>

        <!-- 第 2 步：确认清单 → 上传 -->
        <div id="staged" hidden>
          <div class="staged-head">
            <span class="t" id="staged-count"></span>
            <span class="ops">
              <button type="button" class="linkbtn" id="again">继续添加</button>
              <button type="button" class="linkbtn" id="clear">清空</button>
            </span>
          </div>
          <div id="file-list"></div>
          <div id="blocks" hidden></div>
          <div id="up-status" style="display:none"></div>
          <button type="submit" class="btn btn-primary" id="submit">上传</button>
        </div>

        <div class="usage" id="usage">
          <div class="usage-bar"><div id="usage-fill"></div></div>
          <div class="usage-text"><span id="usage-used"></span><span id="usage-limit"></span></div>
        </div>
        <div class="warn" id="warn" style="display:none">存储空间已达上限，上传已暂停。请删除无用文件释放空间。</div>
      </form>
    </div>
  </section>

  <div class="sec"><span>文件列表</span></div>
  <section class="panel">
    <div id="loading"><div class="spinner"></div>加载中…</div>
    <div id="list"></div>
    <div id="empty" style="display:none">暂无文件</div>
  </section>

  <div class="sec">地址分享</div>
  <section class="panel">
    <div class="share-pad">
      <div class="share-row">
        <span class="url" id="site-url"></span>
        <button class="copy-btn" onclick="copySite()">复制</button>
      </div>
      <div class="share-hint">每个目录行都有「复制链接」按钮，复制后发给他人，打开链接会自动展开并定位到该目录。</div>
      <div id="https-row" hidden>
        <div class="share-row" style="margin-top:10px">
          <span class="url" id="https-url"></span>
          <button class="copy-btn" onclick="copy(httpsUrl)">复制</button>
        </div>
        <div class="share-hint" id="https-note"></div>
      </div>
    </div>
  </section>
</div>

<div id="toast"></div>

<div class="sheet-overlay" id="sheet">
  <div class="sheet">
    <div class="sheet-title" id="sheet-title"></div>
    <div class="sheet-msg" id="sheet-msg"></div>
    <div class="sheet-group"></div>
  </div>
</div>

<script src="crypto.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const fmtSize = (n) => {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
};
const fmtTime = (name) => {
  const m = String(name).match(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})/);
  return m ? `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}` : name;
};
// 相对时间 + 周几（从目录名解析）
const relTag = (name) => {
  const m = String(name).match(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})/);
  if (!m) return '';
  const t = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime();
  const wd = '周' + '日一二三四五六'[new Date(t).getDay()];
  const diff = Date.now() - t;
  if (diff < 60000) return `${wd} · 刚刚`;

const relPath = (f) => f.webkitRelativePath || f.name;

const UPLOAD_TARGET = 4 * 1024 * 1024; // 每个上传块的目标大小（按加密块边界成组，不切开密文块）

const PLAIN_BLOCK = 512 * 1024;

const blockBytes = (plain) => plain + 32;

/** 规划一个文件的上传块：不切开任何一个密文块，组到目标大小就封口；
 *  同时记下每块对应的明文区间 —— 续传时只加密缺的那段，不必重读整个文件。
 *  末尾补一块 0 填充，把密文凑成 PAD_UNIT 的整数倍：中间设备和服务端只看得到密文长度，
 *  于是最多知道"大概多大"，看不出精确字节数（真实大小只记在加密的清单里，下载时裁掉）。 */
function planFile(size, pad = true) {
  const blocks = [];
  let left = size || 0;
  if (!left) blocks.push(blockBytes(0));
  while (left > 0) {
    const plain = Math.min(PLAIN_BLOCK, left);
    blocks.push(blockBytes(plain));
    left -= plain;

  const raw = blocks.reduce((a, b) => a + b, 0);

  const padPlain = pad ? Math.ceil((raw + 32) / PAD_UNIT) * PAD_UNIT - raw - 32 : 0;
  const plan = [];
  let cur = 0, p0 = 0, plainEnd = 0;
  for (const b of blocks) {
    cur += b;
    plainEnd += b - 32;
    if (cur >= UPLOAD_TARGET) {
      plan.push({ bytes: cur, p0, p1: plainEnd, padPlain: 0 });
      cur = 0;
      p0 = plainEnd;
    }

  if (cur || !plan.length) plan.push({ bytes: cur, p0, p1: plainEnd, padPlain: 0 });
  if (padPlain > 0) {
    const last = plan[plan.length - 1]; // 填充块并进最后一块（块数不因此变化）
    last.bytes += 32 + padPlain;

 *  指纹掺入浏览器本地的随机盐：这样外发的 key 与磁盘上的密文名都无法被离线字典攻击

function batchIdentity(files) {
  const raw = `filebox-upload-v1\n${files.length}\n${files.map((f) => `${relPath(f)}\t${f.size}\t${f.lastModified || 0}`).join('\n')}`;

  return saltMemory.get(slot) || fresh;

/** 磁盘上的密文名由批次指纹推出：同一批文件每次续传算出完全相同的布局 */
const encNameOf = (key, i) => `f_${key.slice(0, 12)}${i.toString(16).padStart(2, '0')}.enc`;

/** 批次布局：每个文件的密文块，外加清单（真实文件名映射）那一小块 */
function planBatch(key, files) {
  const items = files.map((f, i) => ({ name: relPath(f), size: f.size, enc: encNameOf(key, i) }));
  const manifestBytes = te.encode(JSON.stringify({ v: 1, files: items }));
  const layout = files.map((f, i) => ({ enc: items[i].enc, plan: planFile(f.size) }));
  layout.push({ enc: 'manifest.enc', plan: planFile(manifestBytes.length, false), manifestBytes });
  for (const f of layout) f.chunks = f.plan.map((c) => c.bytes);
  return { layout, manifestBytes };
}

const apiPost = async (path, body) => {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || '上传失败'); e.status = r.status; throw e; }
  return d;
};

/** 进度长条：每块 = 一个上传块（固定约 4MiB，最后一块是余数），块数随文件大小变。
 *  格子按块数自适应大小：块少时是原来的 9×12，块多就缩小，最多占 STRIP.rows 行 ——
 *  整条始终一眼看全，不在里面做滚动（手机上要滚着看进度等于没有进度）。 */
const STRIP = { wMax: 9, wMin: 3, hMax: 12, hMin: 4, rows: 6, budget: 96 }; // budget：整条最多占这么多 px（不含 padding）
function layoutStrip(b) {

  const inner = box.clientWidth - 6; // 左右各 3px padding

  const perMax = Math.max(1, Math.floor((inner + 2) / (STRIP.wMax + 2)));
  let w = STRIP.wMax;
  if (b.blkEls.length > perMax * STRIP.rows) {
    const need = Math.ceil(b.blkEls.length / STRIP.rows); // 要在 rows 行内摆下，一行至少这么多格
    w = Math.max(STRIP.wMin, Math.floor((inner + 2) / need) - 2);

  const rows = Math.max(1, Math.ceil(b.blkEls.length / Math.max(1, Math.floor((inner + 2) / (w + 2)))));
  const h = Math.max(STRIP.hMin, Math.min(STRIP.hMax, Math.floor(STRIP.budget / rows) - 2));

function renderStrip(b) {
  const box = $('#blocks');
  box.innerHTML = '';

  b.blkEls = [];
  b.blkBase = [];
  b.layout.forEach((spec) => {
    b.blkBase.push(b.blkEls.length);
    spec.chunks.forEach((bytes, ci) => {
      const el = document.createElement('span');
      el.className = 'blk' + (spec.manifestBytes ? ' meta' : '');
      el.title = spec.manifestBytes ? `文件名清单（加密）· ${fmtSize(bytes)}` : `第 ${ci + 1} 块 · ${fmtSize(bytes)}`;
      box.appendChild(el);
      b.blkEls.push(el);
    });
  });
  box.hidden = false;
  layoutStrip(b); // 要先显示出来才量得到宽度
  paintStrip(b);
}

// 转屏/分屏后宽度变了，格子要重新按新行宽排一遍，否则行数会超出预期

/** 按「已传的块」整体重刷（刚进页面看到续传进度、重新选文件时用） */
function paintStrip(b) {
  if (!b || !b.blkEls) return;
  let pointed = false;
  b.layout.forEach((spec, fi) => spec.chunks.forEach((_, ci) => {
    const el = b.blkEls[b.blkBase[fi] + ci];
    if (!el) return;
    const done = b.have.has(`${fi}-${ci}`);
    el.classList.toggle('done', done);
    const active = !done && !pointed;
    el.classList.toggle('active', active);
    if (active) pointed = true;
  }));
}

/** 传完一块：只点亮那一格，把「进行中」挪到下一格（大文件时别整条重刷） */
function markBlockDone(b, fi, ci) {
  if (!b || !b.blkEls) return;
  const el = b.blkEls[b.blkBase[fi] + ci];
  if (!el) return;
  el.classList.remove('active');
  el.classList.add('done');
  const next = el.nextElementSibling;
  if (next && !next.classList.contains('done')) next.classList.add('active');
}

/** 问服务端这批文件有多少块已经传过了；清单一变就重新问（用于「继续上传」） */
async function refreshBatch() {
  if (!selected.length) { batch = null; renderStrip(null); return null; }
  const version = selectionVersion;
  const key = batchIdentity(selected).key;
  const plan = planBatch(key, selected);
  const r = await apiPost('api/upload/init', {
    key,
    files: plan.layout.map(({ enc, chunks }) => ({ enc, chunks })),
  });
  if (version !== selectionVersion) return null; // 期间清单又变了，本次结果作废
  batch = {
    version, key, ...plan,
    uploadId: r.uploadId,
    total: r.total,
    have: new Set(r.have.map((p) => `${p.f}-${p.c}`)),
  };
  renderUpload();
  renderStrip(batch); // 选完文件就能看到「上次传到哪」，点上传前心里有数
  return batch;
}

const syncBatch = () => refreshBatch().catch(() => { batch = null; renderStrip(null); });

// 状态机：未选文件 → 主按钮是「选择文件」；已选 → 清单 + 主按钮「上传」

function renderUpload() {
  const n = selected.length;

  $('#pick-hint').style.display = n ? 'none' : 'block';
  staged.hidden = !n;
  $('#staged-count').textContent = n
    ? `已选 ${n} 个文件 · ${fmtSize(selected.reduce((s, f) => s + f.size, 0))}` : '';
  $('#file-list').innerHTML = selected.map((f, i) => `

// 追加合并（按 名称+大小+修改时间 去重），支持分几次把文件凑齐。
// 带上修改时间：不同目录里同名同大小但内容不同的两个文件不会被误判成重复而丢掉
const fileKey = (f) => `${relPath(f)}@${f.size}@${f.lastModified || 0}`;

function sortSelected() {
  selected.sort((a, b) => {
    const x = relPath(a), y = relPath(b);
    if (x !== y) return x < y ? -1 : 1;
    return a.size - b.size || (a.lastModified || 0) - (b.lastModified || 0);

  if (uploading || !list || !list.length) return;
  const seen = new Set(selected.map(fileKey));
  for (const f of Array.from(list)) {
    const k = fileKey(f);
    if (seen.has(k)) continue;
    seen.add(k);
    selected.push(f);
  }
  sortSelected();
  selectionVersion++;
  renderUpload();
  syncBatch(); // 顺便看看这批有没有可续传的进度

async function upload() {

  uploading = true;

    if (!batch || batch.version !== selectionVersion) {
      setStatus('准备中…');
      await refreshBatch();

    if (!batch || batch.version !== selectionVersion) throw new Error('准备上传失败，请重试');

      const nb = (s) => String(s).replace(/ /g, '\u00A0');
      setStatus(`已传 ${done}/${total} 块 · ${pct}%\n一格 ≈ ${nb(fmtSize(per))} ｜ 约 ${nb(fmtSize(sentBytes()))} / ${nb(fmtSize(allBytes))}`);

        for (let off = seg.p0; off < seg.p1; off += PLAIN_BLOCK) {
          const end = Math.min(off + PLAIN_BLOCK, seg.p1);
          jobs.push(file.slice(off, end).arrayBuffer().then((ab) => enc(new Uint8Array(ab))));
        }

      // 手机上就是这几下把页面冻住、进度条看着像卡住了。改成线程返回 Blob，主线程只发一次请求。

    // body 是 Blob：不可变、可反复读，所以重试直接复用同一个，不用重新加密
    const putChunk = async (fi, ci, body, crc) => {
      const url = `api/upload/part?u=${uploadId}&f=${fi}&c=${ci}`;
      let lastErr = new Error('上传失败');
      for (let attempt = 1; attempt <= CHUNK_ATTEMPTS; attempt++) {
        let r = null, d = {};
        try {
          r = await fetch(url, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/octet-stream', 'X-Chunk-Crc': crc },
            body,
          });
          if (r.ok) return;
          d = await r.json().catch(() => ({}));
        } catch { /* fetch 抛了：网络层失败，按可重试处理 */ }
        const status = r ? r.status : 0;
        // 网络层失败说"上传中断"（别报一个用户看不懂的细节），服务端明确拒绝则照原话显示
        lastErr = status === 0
          ? new Error(navigator.onLine === false ? '网络已断开' : '上传中断')
          : new Error(d.error || `第 ${fi + 1} 个文件第 ${ci + 1} 块上传失败`);
        const worthRetry = status === 0 || status >= 500 || status === 408 || status === 429 ||
          /校验不通过/.test(d.error || '');
        if (!worthRetry) throw lastErr;
        if (attempt < CHUNK_ATTEMPTS) {
          setStatus(`第 ${fi + 1} 个文件第 ${ci + 1} 块重试中（${attempt}/${CHUNK_ATTEMPTS - 1}）…`);
          await sleep(300 * attempt);
        }
      }
      throw lastErr;
    };

    // 并发传块；任一失败就停下并保留进度，下次点「继续上传」接着来
    let cursor = 0;
    let aborted = false; // 报错之后不再开新块：不然界面都写"上传中断"了，后台还在偷偷传
    const inflight = new Set();
    const sendChunk = async (j) => {
      const { fi, ci } = todo[j];
      const spec = layout[fi];
      const { blob, crc } = await encryptChunk(spec, selected[fi], ci);
      if (aborted) return; // 加密期间已经出过错了，这块不发（下次续传会补）
      if (blob.size !== spec.chunks[ci]) throw new Error('分块大小不符，请重试'); // 布局校验：对不上就宁可不传
      const task = putChunk(fi, ci, blob, crc); // 记整段（含重试），完成后才推进度
      inflight.add(task);
      try { await task; } finally { inflight.delete(task); }
      have.add(`${fi}-${ci}`);
      doneNow++;
      markBlockDone(batch, fi, ci);
      paintText();
    };
    const send = async () => {
      for (;;) {
        if (aborted) return;
        const j = cursor++;
        if (j >= todo.length) return;
        try { await sendChunk(j); } catch (err) { aborted = true; throw err; }
      }
    };
    try {
      await Promise.all(Array.from({ length: Math.min(UPLOAD_PARALLEL, todo.length) }, send));
    } catch (err) {
      await Promise.allSettled([...inflight]); // 等在途的块落地，进度才是准的
      throw err;
    }

    setStatus('正在合并…');
    const out = await apiPost('api/upload/finish', { uploadId });
    toast(`上传成功 · ${out.count} 个文件`);
    selected = [];
    batch = null;
    selectionVersion++;
    renderUpload();
    renderStrip(null); // 传完了把进度长条收起来
    refreshList(); // 局部刷新：新目录插进列表，其它行（含展开状态）不动
  } catch (e) {
    // 失败不清清单：进度都还在，点一下就能接着传
    const raw = (e && e.message) || '上传失败';
    const isFetchFail = /Failed to fetch|NetworkError|Load failed|network error/i.test(raw);
    const msg = !isFetchFail ? raw : (navigator.onLine === false ? '网络已断开' : '上传中断');
    if (batch) renderUpload();
    toast(batch && batch.have.size
      ? `${msg}，已传 ${batch.have.size}/${batch.total} 块，点「继续上传」接着传`
      : msg);
    if (/上限/.test(msg)) refreshList();
  } finally {
    uploading = false;
    if (batch && batch.version === selectionVersion) renderUpload();
    else { btn.textContent = '上传'; btn.disabled = overLimit; }
    // 还有没传完的块：长条留着（看得见传到哪了），把"还能接着传"写在下面
    const remain = batch && batch.version === selectionVersion && batch.have.size < batch.total;
    setTimeout(() => {
      if (!remain) $('#blocks').hidden = true;
      setStatus(remain ? `已传 ${batch.have.size}/${batch.total} 块，点「继续上传」接着传` : '');
    }, remain ? 0 : 600);
  }
}

function keepManifest(folder, p) {
  manifestCache[folder] = p;
  const keys = Object.keys(manifestCache); // 字符串键按插入顺序枚举，最前面的就是最久没用的
  for (let i = 0; i < keys.length - MANIFEST_KEEP; i++) delete manifestCache[keys[i]];

const HOT_MS = 10 * 60 * 1000; // 「热乎」判定窗口

function folderTime(name) {
  const m = String(name).match(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})/);
  if (!m) return null;
  return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime();
}
const isFresh = (name) => {

/** 只改会变的那两行文字，不碰展开状态、也不碰正在打包的按钮文案 */

function applyList(data, full) {
  const listBox = $('#list'), loading = $('#loading'), empty = $('#empty');
  const wanted = data.folders;
  if (full) {
    // 整页加载/手动刷新：按「此刻」重算热乎（超过 10 分钟的自然就掉了）
    hotFolders = new Set(wanted.filter((f) => isFresh(f.name)).map((f) => f.name));
    knownFolders = new Set(wanted.map((f) => f.name));
    listBox.innerHTML = wanted.map(folderHtml).join('');
  } else {
    // 10 秒轮询：新冒出来的目录判一次热乎，已判过的不动（所以不刷新页面就一直留着）
    const existing = new Map([...listBox.children].map((el) => [el.dataset.name, el]));
    let cursor = listBox.firstElementChild;
    for (const f of wanted) {
      if (!knownFolders.has(f.name)) {
        knownFolders.add(f.name);
        if (isFresh(f.name)) hotFolders.add(f.name);
      }
      let el = existing.get(f.name);
      if (!el) {
        el = document.createElement('div');
        el.innerHTML = folderHtml(f);
        el = el.firstElementChild;
        listBox.insertBefore(el, cursor);
      } else if (el === cursor) {
        patchFolder(el, f);
        cursor = cursor.nextElementSibling;
      } else {
        patchFolder(el, f);
        listBox.insertBefore(el, cursor);
      }
    }
    for (const [name, el] of existing) {
      if (!wanted.some((f) => f.name === name)) {
        knownFolders.delete(name);
        el.remove();
      }
    }
  }
  loading.style.display = 'none';
  empty.style.display = wanted.length ? 'none' : 'block';
}

/** 拉列表；full=整表重画（会重算热乎），否则只做增删改的局部更新 */

// 拉取并解密目录清单（真实文件名）。
// 404 = 旧数据真的没有清单（返回 null，走兼容展示）；其他失败 = 网络/解密出错（抛出，让用户重试）
function getManifest(folder) {
  if (!manifestCache[folder]) {
    keepManifest(folder, fetch(`api/download/${enc(folder)}/manifest.enc`)
      .then(async (r) => {
        if (r.status === 404) return null;
        if (!r.ok) throw new Error(`清单拉取失败 (${r.status})`);
        return JSON.parse(td.decode(await FBCrypto.decryptBytes(new Uint8Array(await r.arrayBuffer()))));
      }));
  }
  return manifestCache[folder];
}

// ---------- 下载（自动解密） ----------
async function fetchAndDecrypt(folder, encName) {
  const r = await fetch(`api/download/${enc(folder)}/${enc(encName)}`);
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw new Error(d.error || '下载失败');
  }
  return FBCrypto.decryptStream(r.body);
}
/** 明文按清单里的真实大小裁剪：上传时为了藏住精确大小补过 0，这里把填充去掉，
 *  顺便校验长度对不对（短了就是坏了，宁可报错也别给用户半个文件）。
 *  size 传 null 表示"不知道真实大小"（旧数据/没有清单），此时原样返回 ——
 *  注意 0 是合法大小，不能和"不知道"混为一谈。 */
function trimToDeclared(blob, size) {
  if (size === null) return blob;
  if (blob.size < size) throw new Error('文件长度与清单不符（数据不完整）');
  return blob.size > size ? blob.slice(0, size) : blob;
}

// ---------- 打包下载：一条聚合流 + 多核解密 + 边解边拼 zip（STORE 模式，不压缩） ----------
// CRC32 在 crypto.js 里（FBCrypto.crcFeed / crcDone），主线程与工作线程共用同一份实现

// zip 写入器：数据分片以 Blob 引用按序拼接，内存占用不再翻倍
function createZipWriter() {
  const parts = [], central = [];
  let offset = 0;
  const d = new Date();
  const dosTime = ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | ((d.getSeconds() >> 1) & 31);
  const dosDate = (((d.getFullYear() - 1980) & 127) << 9) | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31);
  return {
    add(name, crc, size, dataParts) {
      if (size > 0xffffff00) throw new Error('单个文件超 4GB，无法打包，请单独下载');
      if (offset > 0xffffff00) throw new Error('内容过大（超 4GB），请逐个下载');
      const nameB = te.encode(name);
      const lh = new Uint8Array(30 + nameB.length);
      const v = new DataView(lh.buffer);
      v.setUint32(0, 0x04034b50, true); v.setUint16(4, 20, true); v.setUint16(6, 0x0800, true);
      v.setUint16(8, 0, true); v.setUint16(10, dosTime, true); v.setUint16(12, dosDate, true);
      v.setUint32(14, crc, true); v.setUint32(18, size, true); v.setUint32(22, size, true);
      v.setUint16(26, nameB.length, true); v.setUint16(28, 0, true);
      lh.set(nameB, 30);
      parts.push(lh, ...dataParts);
      const cd = new Uint8Array(46 + nameB.length);
      const c = new DataView(cd.buffer);
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true);
      c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true); c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true);
      c.setUint32(16, crc, true); c.setUint32(20, size, true); c.setUint32(24, size, true);
      c.setUint16(28, nameB.length, true); c.setUint32(42, offset, true);
      cd.set(nameB, 46);
      central.push(cd);
      offset += lh.length + size;
    },
    finish(count) {
      const cdSize = central.reduce((s, x) => s + x.length, 0);
      const eocd = new Uint8Array(22);
      const ev = new DataView(eocd.buffer);
      ev.setUint32(0, 0x06054b50, true);
      ev.setUint16(8, count, true); ev.setUint16(10, count, true);
      ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
      return new Blob([...parts, ...central, eocd], { type: 'application/zip' });
    },
  };
}

// 归档流读取器：带缓冲，可精确取 n 字节（fill）或按需取一段（take）
function createArchiveReader(body) {
  const reader = body.getReader();
  let buf = new Uint8Array(0), pos = 0;
  const pull = async () => {
    const r = await reader.read();
    if (r.done) return false;
    if (!r.value || !r.value.length) return true;
    if (pos === buf.length) { buf = r.value; pos = 0; return true; }
    const rest = buf.length - pos;
    const nb = new Uint8Array(rest + r.value.length);
    nb.set(buf.subarray(pos), 0);
    nb.set(r.value, rest);
    buf = nb; pos = 0;
    return true;
  };
  return {
    async fill(target, off, n) {
      let got = 0;
      while (got < n) {
        if (pos >= buf.length && !(await pull())) throw new Error('归档数据不完整');
        const take = Math.min(n - got, buf.length - pos);
        target.set(buf.subarray(pos, pos + take), off + got);
        pos += take;
        got += take;
      }
      return target;
    },
    async take(max) {
      while (pos >= buf.length) { if (!(await pull())) return null; }
      const take = Math.min(max, buf.length - pos);
      const out = buf.subarray(pos, pos + take);
      pos += take;
      return out;
    },
  };
}

// 密文块：[4B 明文长度][12B IV][密文+16B 校验]
async function readEncBlock(rd, max) {
  const h = await rd.fill(new Uint8Array(4), 0, 4);
  const len = ((h[0] << 24) | (h[1] << 16) | (h[2] << 8) | h[3]) >>> 0;
  const n = 4 + 12 + len + 16;
  if (n > max) throw new Error('归档数据不完整');
  const block = new Uint8Array(n);
  block.set(h, 0);
  await rd.fill(block, 4, n - 4);
  return { block, n };
}

// 解密线程池（只在纯 JS 引擎下用；原生 WebCrypto 已快三个数量级）。
// 建一次长期复用；密钥由 0 号线程派生一次再分发给其余线程——否则每个线程都要各跑一次
// 12 万次 PBKDF2（实测每次约 2s），6 个线程就是白等 2s 还占满 CPU。
let packPool = null;
function getDecryptPool() {
  if (packPool) return packPool;
  const size = Math.max(2, Math.min(6, Math.ceil((navigator.hardwareConcurrency || 4) / 2)));
  const engine = FBCrypto.native ? 'native' : 'js';
  const idle = [], busy = new Map(), queue = [];
  let seq = 0;
  const dispatch = () => {
    while (queue.length && idle.length) {
      const w = idle.pop(), job = queue.shift();
      busy.set(w, job.resolve);
      if (job.op === 'encrypt') {
        w.postMessage({ op: 'encrypt', id: job.id, bytes: job.bytes, engine: job.engine }, [job.bytes.buffer]);
      } else if (job.op === 'join') {
        w.postMessage({ op: 'join', id: job.id, parts: job.parts }, job.parts.map((p) => p.buffer));
      } else {
        w.postMessage({ op: 'decrypt', id: job.id, block: job.block, engine: job.engine }, [job.block.buffer]);
      }
    }
  };
  const admit = (w) => {
    if (w.__in) return;
    w.__in = true;
    idle.push(w);
    dispatch();
  };
  const workers = [];
  for (let i = 0; i < size; i++) {
    const w = new Worker('dec-worker.js');
    w.onmessage = (e) => {
      const msg = e.data;
      if (msg.op === 'key') {
        // 主线程也用这把钥匙：纯 JS 引擎下首次加密/解密本来要在主线程同步跑
        // 12 万次 PBKDF2（实测约 2s，页面直接冻住），这里借线程的成果省掉
        FBCrypto.importJsKey(msg.key);
        // 同一线程的消息按 FIFO 处理，密钥一定排在解密任务前面
        for (let k = 1; k < size; k++) workers[k].postMessage({ op: 'initKey', key: msg.key, engine });
        workers.forEach(admit);
        packPool.lastEngine = msg.engine || engine;
        return;
      }
      const resolve = busy.get(w);
      busy.delete(w);
      idle.push(w);
      if (msg.engine) packPool.lastEngine = msg.engine; // 记录线程实际用的引擎
      if (resolve) resolve(msg);
      dispatch();
    };
    w.onerror = () => {
      const i = idle.indexOf(w);
      if (i >= 0) idle.splice(i, 1);
      const resolve = busy.get(w);
      busy.delete(w);
      if (resolve) resolve({ error: '解密线程异常' });
      workers.forEach(admit); // 有线程掉线也别把任务卡死
    };
    workers.push(w);
  }
  if (engine === 'native') {
    workers.forEach(admit);
  } else {
    admit(workers[0]);
    workers[0].postMessage({ op: 'deriveKey', engine });
    setTimeout(() => workers.forEach(admit), 15000); // 0 号没回密钥就退化成各线程自己派生
  }
  packPool = {
    size,
    lastEngine: null,
    decrypt(block) {
      const id = ++seq;
      return new Promise((resolve) => {
        queue.push({ op: 'decrypt', id, block, engine: FBCrypto.native ? 'native' : 'js', resolve });
        dispatch();
      }).then((r) => { if (r.error) throw new Error(r.error); return r.pt; });
    },
    /** 加密也交给线程池：纯 JS 引擎下主线程单干只有 ~2.6MB/s，手机上传会拖成分钟级 */
    encrypt(bytes) {
      const id = ++seq;
      return new Promise((resolve) => {
        queue.push({ op: 'encrypt', id, bytes, engine: FBCrypto.native ? 'native' : 'js', resolve });
        dispatch();
      }).then((r) => { if (r.error) throw new Error(r.error); return r.ct; });
    },
    /** 拼块 + 算 CRC 也交给线程（主线程实测要 270ms，手机降频下更久），回一个可直接 PUT 的 Blob */
    join(parts) {
      const id = ++seq;
      return new Promise((resolve) => {
        queue.push({ op: 'join', id, parts, resolve });
        dispatch();
      }).then((r) => { if (r.error) throw new Error(r.error); return r; });
    },
  };
  return packPool;
}

let zipping = false; // 防止打包期间重复点击
async function downZip(nameEnc, btn) {
  if (zipping) { toast('正在打包中，请稍候'); return; }
  zipping = true;
  const folder = decodeURIComponent(nameEnc);
  const label = btn ? btn.textContent : '';
  const setLabel = (t) => { if (btn) { btn.textContent = t; btn.disabled = true; } };
  let pool = null;
  let lastPaint = 0;
  const paint = (done, total) => {
    const now = performance.now();
    if (!total || now - lastPaint < 120) return;
    lastPaint = now;
    setLabel(Math.min(99, Math.floor((done / total) * 100)) + '%');
  };

  try {
    const r = await fetch(`api/archive/${enc(folder)}`);
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || '打包失败');
    }
    const total = Number(r.headers.get('Content-Length')) || 0;
    // 小目录不值得起线程（建池 + 派生密钥就要 0.7s）
    if (!FBCrypto.native && total > 4 * 1024 * 1024) pool = getDecryptPool();
    const rd = createArchiveReader(r.body);
    const zip = createZipWriter();
    const win = (pool ? pool.size : 0) + 1; // 在途块数：让网络与多核解密重叠
    let nameMap = null, sizeMap = null, count = 0, done = 0, consumed = 0;
    setLabel('0%');

    for (;;) {
      let head;
      try {
        head = await rd.fill(new Uint8Array(10), 0, 10);
      } catch {
        if (consumed === total) break; // 正常读完
        throw new Error('归档数据不完整');
      }
      const hv = new DataView(head.buffer);
      const nameLen = hv.getUint16(0);
      const size = hv.getUint32(2) * 4294967296 + hv.getUint32(6);
      const name = td.decode(await rd.fill(new Uint8Array(nameLen), 0, nameLen));
      consumed += 10 + nameLen;

      if (name === 'manifest.enc') {
        const mf = await rd.fill(new Uint8Array(size), 0, size);
        consumed += size; done += size;
        // 清单也交给线程池：纯 JS 引擎下首次派生密钥要 0.7s，别冻住主线程
        const plain = await (pool ? pool.decrypt(mf) : FBCrypto.decryptBytes(mf));
        const m = JSON.parse(td.decode(plain));
        if (m && m.files) {
          nameMap = new Map(m.files.map((x) => [x.enc, x.name]));
          sizeMap = new Map(m.files.map((x) => [x.enc, x.size])); // 明文真实大小：用来裁掉长度填充
        }
        continue;
      }

      const dataParts = [];
      let crc = 0xffffffff, psize = 0, left = size;
      const declared = sizeMap ? sizeMap.get(name) : undefined;
      const emit = (pt) => {
        let chunk = pt;
        // 上传时为藏住精确大小补过 0：按清单里的真实大小裁掉（旧文件没补过，等于不裁）
        if (declared !== undefined && psize + chunk.length > declared) {
          chunk = chunk.subarray(0, Math.max(0, declared - psize));
        }
        crc = FBCrypto.crcFeed(chunk, crc);
        psize += chunk.length;
        dataParts.push(new Blob([chunk]));
      };
      if (nameMap) {
        // 加密目录：边下边分块解密，最多 win 块在途
        const inflight = [];
        while (left > 0) {
          const blk = await readEncBlock(rd, left);
          left -= blk.n;
          consumed += blk.n;
          done += blk.n;
          inflight.push(pool ? pool.decrypt(blk.block) : FBCrypto.decryptBytes(blk.block));
          if (inflight.length >= win) emit(await inflight.shift());
          paint(done, total);
        }
        while (inflight.length) emit(await inflight.shift());
      } else {
        // 旧数据（未加密）：原样搬运
        while (left > 0) {
          const chunk = await rd.take(left);
          if (!chunk) throw new Error('归档数据不完整');
          left -= chunk.length;
          consumed += chunk.length;
          done += chunk.length;
          emit(chunk);
          paint(done, total);
        }
      }
      // 裁掉填充后长度必须与清单声明的一致，短了就是坏了 —— 宁可报错也别给半个文件
      if (declared !== undefined && psize !== declared) {
        throw new Error('文件长度与清单不符（数据不完整）');
      }
      zip.add((nameMap && nameMap.get(name)) || name, FBCrypto.crcDone(crc), psize, dataParts);
      count++;
    }

    if (!count) { toast('目录为空'); return; }
    setLabel('打包中…');
    saveBlob(zip.finish(count), `${folder}.zip`);
    toast('已下载');
  } catch (e) {
    toast(e.message || '打包失败');
  } finally {
    setLabel(label);
    if (btn) btn.disabled = false;
    zipping = false;
  }
}

// ---------- 通用 iOS 弹层（动作列表 / 确认） ----------
const sheet = $('#sheet');
function actionSheet({ title = '', msg = '', actions = [] }) {
  $('#sheet-title').textContent = title;
  $('#sheet-msg').textContent = msg;
  const group = sheet.querySelector('.sheet-group');
  group.innerHTML = '';
  for (const a of actions) {
    const b = document.createElement('button');
    b.textContent = a.label;
    if (a.class) b.className = a.class;
    b.addEventListener('click', () => { closeSheet(); a.onClick && a.onClick(); });
    group.appendChild(b);
  }
  sheet.classList.add('show');
}
function closeSheet() { sheet.classList.remove('show'); }
sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });

// ---------- 删除（确认弹层） ----------
function delFolder(name) {
  const folder = decodeURIComponent(name);
  actionSheet({
    title: '删除该目录？',
    msg: `“${fmtTime(folder)}”目录及其中所有文件将被永久删除，此操作无法撤销。`,
    actions: [
      {
        label: '删除',
        class: 'sheet-del',
        onClick: async () => {
          try {
            const r = await fetch(`api/folder/${name}`, { method: 'DELETE' });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(d.error || '删除失败');
            delete manifestCache[folder];
            toast('已删除');
            refreshList(); // 局部移除该行即可
          } catch (e) {
            // 目录已被删掉时，刷新列表移除幽灵行
            toast(e.message);
            refreshList();
          }
        },
      },
      { label: '取消', class: 'sheet-cancel' },
    ],
  });
}

// ---------- 地址分享 ----------
const siteUrl = location.origin + location.pathname;
let httpsUrl = ''; // 仅在 HTTP 兼容模式下才有值（见 loadList）
$('#site-url').textContent = siteUrl;
const shareFolder = new URLSearchParams(location.search).get('folder') || '';

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch {}
    document.body.removeChild(ta);
    ok ? resolve() : reject(new Error('copy failed'));
  });
}
async function copy(url) {
  try { await copyText(url); toast('已复制'); }
  catch { toast('复制失败，请手动复制'); }
}
function copySite() { copy(siteUrl); }
function copyFolder(name) { copy(`${siteUrl}?folder=${name}`); }

loadList();
// HTTP 兼容模式下提前把解密线程池建好并派生一次密钥（约 2s，全程只一次），
// 用户点「打包下载」时就不用干等；原生引擎用不上线程池，跳过。
if (!FBCrypto.native) {
  const warm = () => getDecryptPool();
  if ('requestIdleCallback' in window) requestIdleCallback(warm, { timeout: 5000 });
  else setTimeout(warm, 2000);
}
